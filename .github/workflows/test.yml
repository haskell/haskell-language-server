name: Testing

defaults:
  run:
    shell: bash

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  TEST_PATTERN: "import path order determines module file"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.14", "9.12", "9.10.2", "9.8", "9.6"]
    env:
      # We choose a very short build directory, as we run into long path issues on windows.
      # See cabal tracking issue https://github.com/haskell/cabal/issues/11395
      CABAL_ARGS: "--builddir b"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          ghc: ${{ matrix.ghc }}
          os: ${{ runner.os }}

      - name: Build
        # Persisted so that the later cabal invocations solve the same plan
        run: |
          cabal configure --max-backjumps 10000
          cabal build ${CABAL_ARGS} ghcide-tests

      - name: Isolated runs with debug logging
        env:
          HLS_TEST_LOG_STDERR: "1"
        run: |
          bin=$(cabal list-bin ${CABAL_ARGS} ghcide-tests)
          for i in $(seq 10); do
            echo "::group::run $i"
            "$bin" -p "$TEST_PATTERN" || echo "::warning::run $i failed"
            echo "::endgroup::"
          done
