name: Benchmark

defaults:
  run:
    shell: bash

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - '**'

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      bench_ghc_versions: ${{ steps.set_ghc_versions.outputs.versions }}
    steps:
      - id: set_ghc_versions
        run: |
          # benching the two latest GHCs we support now
          # since benchmark are expansive.
          # choosing the two latest are easier to maintain and more forward looking
          # see discussion https://github.com/haskell/haskell-language-server/pull/4118
          # Benchmarking only the two latest GHCs we support now
          # since benchmark are expensive.
          # Choosing the two latest is easier to maintain and more forward looking.
          # See discussion https://github.com/haskell/haskell-language-server/pull/4118
          # also possible to add more GHCs if we perform better in the future.
          echo 'versions=["9.12", "9.14"]' >> $GITHUB_OUTPUT
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          cancel_others: false
          paths_ignore: '[ "**/docs/**"
                         , "**.md"
                         , "**/LICENSE"
                         , "**.nix"
                         , "**/test/**"
                         , "flake.lock"
                         , "**/README.md"
                         , "FUNDING.yml"
                         , "**/stack*.yaml"
                         , ".gitlab-ci.yaml"
                         , ".gitlab/**"
                         ]'

  bench:
    if: needs.pre_job.outputs.should_skip != 'true'
    needs: pre_job
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        ghc: ${{ fromJSON(needs.pre_job.outputs.bench_ghc_versions) }}
        os:
          - ubuntu-latest

    # This code is fitted to the strategy: assumes Linux is used ... etc,
    # change of the strategy may require changing the bootstrapping/run code

    steps:
    - uses: actions/checkout@v7
      with:

        # By default, the `pull_request` event has a `GITHUB_SHA` env variable
        # set to the "last merge commit on the GITHUB_REF branch" (see
        # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request).
        # But we want to check out the latest commit on the branch whether or
        # not it is a merge commit, so this is how we do that.
        ref: "${{ github.event.pull_request.head.sha }}"

    - run: git fetch origin master # check the master branch for benchmarking

    - uses: ./.github/actions/setup-build
      with:
        ghc: ${{ matrix.ghc }}
        os:  ${{ runner.os }}
        shorten-hls: "false"

    # max-backjumps is increased as a temporary solution
    # for dependency resolution failure
    - run: cabal configure --enable-benchmarks --max-backjumps 12000

    - name: Build
      run: cabal build exe:ghcide-bench

    - name: Bench
      run: cabal run ghcide-bench -- --example-name cabal --samples 10 --no-clean --rts-profiling rts-stats --csv results.csv

    - name: Display results
      run: .github/bench.hs results.csv rts-stats


